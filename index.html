<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mridul Saravanan &ndash; projects, AI experiments and findings</title>
<meta name="description" content="Mridul Saravanan explores AI, tests how it behaves, and documents what he learns: projects, an AI lab, findings and learning notes.">
<meta property="og:title" content="Mridul Saravanan">
<meta property="og:description" content="I explore AI, test how it behaves, and document what I learn.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mridulsaravanan.com/">
<link rel="canonical" href="https://mridulsaravanan.com/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230E1024%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27Arial%27 font-weight=%27700%27 font-size=%2715%27 text-anchor=%27middle%27 fill=%27%23FFB45E%27%3EMS%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* -----------------------------------------------------------------
   Mridul Saravanan - personal lab
   Light paper base, and four vibrant colours that MEAN something:
   cobalt = builds, violet = AI lab, sun = findings, mint = notes.
   Bricolage Grotesque for headings, Figtree for reading,
   IBM Plex Mono only for labels, dates and status.
   ----------------------------------------------------------------- */
:root{
  --bg:#F5F6FB; --surface:#FFFFFF; --ink:#10122B; --ink2:#454A6B; --muted:#757A99;
  --line:#E3E5F1; --line2:#CFD3E6;
  --cobalt:#3245FF; --cobalt-d:#2433D6; --cobalt-l:#E8EAFF;
  --violet:#7448FF; --violet-l:#EFE9FF;
  --sun:#FFC53D; --sun-l:#FFF4D6;
  --mint:#12B886; --mint-l:#DDF7EE;
  --rose:#FF4F79;
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:22px; --wrap:1160px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --lift:0 18px 40px -22px rgba(16,18,43,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.62 var(--body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit}
img{max-width:100%;display:block}
::selection{background:var(--sun);color:var(--ink)}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:3px;border-radius:8px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 28px}
.mono{font-family:var(--mono);font-size:.78rem;letter-spacing:.02em}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:#fff;padding:8px 12px;border-radius:8px;z-index:100}
.skip:focus{left:12px}

/* header: stays put while pages change */
.site-header{position:sticky;top:0;z-index:50;background:rgba(245,246,251,.86);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line);view-transition-name:site-header}
.site-header .wrap{display:flex;align-items:center;gap:20px;height:68px}
.brand{display:flex;align-items:center;gap:10px;font:800 1.1rem/1 var(--display);letter-spacing:-.015em;text-decoration:none;white-space:nowrap}
.brand i{width:28px;height:28px;border-radius:9px;background:conic-gradient(from 210deg,var(--cobalt),var(--violet),var(--rose),var(--sun),var(--mint),var(--cobalt));display:inline-block;flex:none}
.nav{display:flex;gap:2px;margin-left:10px}
.nav a{text-decoration:none;color:var(--ink2);font-weight:600;font-size:.95rem;padding:9px 13px;border-radius:12px;transition:background .25s var(--ease),color .25s var(--ease)}
.nav a:hover{color:var(--ink);background:#EBEDF7}
.nav a[aria-current="page"]{color:var(--cobalt-d);background:var(--cobalt-l)}
.h-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);color:var(--ink2);display:grid;place-items:center;cursor:pointer;text-decoration:none;transition:transform .25s var(--ease),border-color .25s,color .25s}
.icon-btn:hover{color:var(--cobalt);border-color:var(--cobalt);transform:translateY(-1px)}
.icon-btn svg{width:19px;height:19px}
.btn{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 20px;border-radius:14px;font:700 .96rem/1 var(--body);text-decoration:none;cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink);transition:transform .25s var(--ease),box-shadow .25s var(--ease),background .25s}
.btn:hover{transform:translateY(-2px);box-shadow:var(--lift)}
.btn.primary{background:var(--ink);color:#fff}
.btn.sun{background:var(--sun);border-color:var(--sun);color:var(--ink)}
.btn.ghost-light{border-color:rgba(255,255,255,.7);color:#fff}
.btn.sm{height:40px;padding:0 16px;font-size:.9rem;border-radius:12px}
.menu-btn{display:none}

/* page scaffolding */
main{min-height:60vh;view-transition-name:page}
.page{padding-top:60px;padding-bottom:84px}
.page-head{max-width:780px;margin-bottom:40px}
.page-head h1{font:800 clamp(2.2rem,4.6vw,3.4rem)/1.04 var(--display);letter-spacing:-.035em;margin:0 0 16px}
.page-head p{color:var(--ink2);font-size:1.12rem;margin:0}
.page-head .kind{display:inline-block;margin-bottom:14px}
h2.sec{font:800 clamp(1.5rem,2.4vw,1.9rem)/1.1 var(--display);letter-spacing:-.025em;margin:0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.sec-head a{color:var(--cobalt-d);font-weight:700;font-size:.95rem;text-decoration:none}
.sec-head a:hover{text-decoration:underline;text-underline-offset:4px}
section+section{margin-top:84px}

/* status + tags (the word is always shown, never colour alone) */
.badge{display:inline-flex;align-items:center;gap:6px;font:500 .72rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:999px;background:#EEF0F7;color:var(--ink2)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.working,.badge.published{background:var(--mint-l);color:#08795A}
.badge.prototype,.badge.in-progress,.badge.running,.badge.designing{background:var(--sun-l);color:#8A5A00}
.badge.idea,.badge.exploring{background:var(--violet-l);color:#5631D6}
.badge.observed{background:#FFE4EA;color:#C2264D}
.kind{font:500 .74rem/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--cobalt-d)}
.kind.lab{color:#5631D6}.kind.find{color:#8A5A00}.kind.note{color:#08795A}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:400 .75rem/1 var(--mono);color:var(--ink2);background:#EEF0F7;border-radius:999px;padding:6px 10px}

/* hero: a cobalt block with a notebook grid, and a real lab record */
.hero{position:relative;overflow:hidden;background:var(--cobalt);color:#fff;
  background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);
  background-size:40px 40px;background-position:-1px -1px}
.hero::after{content:"";position:absolute;right:-120px;bottom:-160px;width:420px;height:420px;border-radius:50%;background:var(--violet);opacity:.55;pointer-events:none}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:56px;align-items:center;padding-top:76px;padding-bottom:84px}
.eyebrow{display:inline-block;font:500 .74rem/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);background:var(--sun);border-radius:999px;padding:7px 12px;margin:0 0 22px}
.hero h1{font:800 clamp(2.6rem,6vw,4.6rem)/.98 var(--display);letter-spacing:-.045em;margin:0 0 22px}
.hero h1 span{display:block}
.hero .lede{font-size:1.14rem;color:#E1E5FF;max-width:35em;margin:0 0 32px}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.hero .ctas .link{color:#fff;font-weight:600;margin-left:6px;text-underline-offset:5px}
.record{background:var(--surface);color:var(--ink);border-radius:var(--r);overflow:hidden;box-shadow:0 40px 80px -30px rgba(10,14,80,.6);transform:rotate(1.2deg);transition:transform .5s var(--ease)}
.record:hover{transform:rotate(0)}
.record-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.record-body{padding:18px 18px 16px}
.record .q{color:var(--ink2);font-size:.93rem;margin:0 0 12px}
.record .a{font-size:1.02rem;margin:0 0 14px;padding-left:12px;border-left:3px solid var(--cobalt-l)}
.record mark{background:#FFE4EA;color:var(--ink);border-radius:4px;padding:0 3px}
.verdict{display:flex;gap:10px;align-items:flex-start;background:#FFF1F4;border-radius:14px;padding:11px 13px;font-size:.92rem;color:#7A1F37}
.verdict b{color:#C2264D}
.record-foot{padding:11px 18px;border-top:1px solid var(--line);color:var(--muted);margin:0}

/* cards */
.featured{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.card.big{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.card.big .shot{aspect-ratio:auto;padding:26px 26px 0;border-bottom:0;border-right:1px solid var(--line);display:flex;align-items:flex-end}
.card.big .shot img{height:auto;aspect-ratio:16/10}
.card.big .body{padding:34px 34px 30px;justify-content:center;gap:14px}
.card.big h3{font-size:clamp(1.6rem,2.4vw,2.1rem)}
.card.big p{font-size:1.05rem;max-width:30em}
.card.big .links{margin-top:6px;font-size:1rem}
.card{--accent:var(--cobalt);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit;transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .35s}
.card:hover{transform:translateY(-4px);box-shadow:0 26px 50px -28px color-mix(in srgb,var(--accent) 55%,transparent);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.card .shot{aspect-ratio:16/10;background:linear-gradient(135deg,var(--cobalt-l),var(--violet-l));overflow:hidden;border-bottom:1px solid var(--line);padding:18px 18px 0}
.card .shot img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:12px 12px 0 0;box-shadow:0 10px 30px -14px rgba(16,18,43,.4);transition:transform .6s var(--ease),opacity .5s}
.card:hover .shot img{transform:scale(1.025)}
.fallback{width:100%;height:100%;min-height:150px;display:grid;place-items:center;border-radius:12px 12px 0 0;background:repeating-linear-gradient(135deg,transparent 0 14px,rgba(50,69,255,.06) 14px 15px)}
.fallback span{font:500 .74rem/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);background:var(--surface);padding:8px 12px;border-radius:999px}
.card .body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:10px;flex:1}
.card h3{font:800 1.32rem/1.15 var(--display);letter-spacing:-.02em;margin:0}
.card h3 a{text-decoration:none}
.card p{margin:0;color:var(--ink2);font-size:.97rem}
.meta-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.links{display:flex;gap:16px;flex-wrap:wrap;margin-top:auto;padding-top:8px;font-size:.93rem;font-weight:700}
.links a{color:var(--cobalt-d);text-decoration:none}
.links a:hover{text-decoration:underline;text-underline-offset:4px}

/* explore: one colour per kind of content */
.explore{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.explore a{border-radius:var(--r);padding:24px 22px;text-decoration:none;display:flex;flex-direction:column;gap:10px;min-height:190px;transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.explore a:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:var(--lift)}
.explore b{font:800 1.3rem/1.1 var(--display);letter-spacing:-.02em}
.explore span{font-size:.95rem;opacity:.86}
.explore .count{margin-top:auto;opacity:1;font-weight:500}
.explore .c-build{background:var(--cobalt);color:#fff}
.explore .c-lab{background:var(--violet);color:#fff}
.explore .c-find{background:var(--sun);color:var(--ink)}
.explore .c-note{background:var(--mint);color:#04261C}

/* current focus */
.focus{display:grid;grid-template-columns:180px minmax(0,1fr);gap:28px;align-items:start;background:var(--violet-l);border-radius:var(--r);padding:34px 36px}
.focus .kind{color:#5631D6}
.focus p{font:600 clamp(1.15rem,2vw,1.45rem)/1.45 var(--display);letter-spacing:-.012em;margin:0;max-width:36em;color:#24124F}

/* updates */
.updates{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.updates li+li{border-top:1px solid var(--line)}
.updates a{display:grid;grid-template-columns:130px 110px minmax(0,1fr) 24px;gap:16px;padding:18px 22px;text-decoration:none;align-items:center;transition:background .25s}
.updates a:hover{background:var(--cobalt-l)}
.updates .t{font:700 1.05rem/1.2 var(--display)}
.updates .d{color:var(--muted)}
.updates .go{color:var(--cobalt);font-weight:700;transition:transform .25s var(--ease)}
.updates a:hover .go{transform:translateX(4px)}

/* contact cta */
.cta{background:var(--sun);border-radius:28px;padding:44px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center;position:relative;overflow:hidden}
.cta::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:var(--rose);opacity:.85}
.cta>*{position:relative;z-index:1}
.cta h2{font:800 clamp(1.7rem,3.2vw,2.4rem)/1.08 var(--display);letter-spacing:-.03em;margin:0 0 10px}
.cta p{margin:0;color:#3A2A00;max-width:34em}
.cta .row{display:flex;gap:10px;flex-wrap:wrap}

/* listings */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
.filters button{font:600 .9rem/1 var(--body);color:var(--ink2);background:var(--surface);border:1px solid var(--line2);border-radius:999px;padding:10px 15px;cursor:pointer;transition:all .25s var(--ease)}
.filters button:hover{color:var(--ink);border-color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.rows{display:flex;flex-direction:column;gap:14px}
.row-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;padding:24px 26px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;align-items:start;transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .35s}
.row-item:hover{transform:translateY(-3px);box-shadow:0 22px 44px -28px rgba(116,72,255,.55);border-color:#D9CCFF}
.row-item h3{font:800 1.25rem/1.2 var(--display);letter-spacing:-.015em;margin:0 0 6px}
.row-item p{margin:0;color:var(--ink2);max-width:46em}
.row-item .side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.figure-num{font:800 2rem/1 var(--display);color:var(--cobalt);letter-spacing:-.03em;min-width:110px}
.finding-row{grid-template-columns:120px minmax(0,1fr) auto}
.empty{background:var(--surface);border:1.5px dashed var(--line2);border-radius:var(--r);padding:56px 28px;text-align:center;color:var(--ink2)}
.empty .glyph{width:64px;height:64px;border-radius:20px;margin:0 auto 16px;display:grid;place-items:center;font:800 1.6rem/1 var(--display)}
.empty b{display:block;color:var(--ink);font:800 1.3rem/1.25 var(--display);margin-bottom:8px;letter-spacing:-.015em}
.empty.find .glyph{background:var(--sun-l);color:#8A5A00}
.empty.note .glyph{background:var(--mint-l);color:#08795A}
.empty.about .glyph{background:var(--cobalt-l);color:var(--cobalt)}
.empty.about{margin-bottom:56px}
.empty b:last-child{margin-bottom:0}

/* detail pages */
.crumbs{margin-bottom:24px;color:var(--muted)}
.crumbs a{color:var(--cobalt-d);text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:52px;align-items:start}
.detail .lead{font-size:1.18rem;color:var(--ink2);margin:0 0 24px}
.detail .hero-shot{border-radius:var(--r);overflow:hidden;margin:0 0 38px;background:linear-gradient(135deg,var(--cobalt-l),var(--violet-l));padding:22px 22px 0}
.detail .hero-shot img{width:100%;border-radius:12px 12px 0 0;box-shadow:0 14px 34px -16px rgba(16,18,43,.45)}
.prose{max-width:44em}
.prose h2{font:800 1.35rem/1.2 var(--display);letter-spacing:-.015em;margin:38px 0 10px}
.prose p,.prose li{color:var(--ink2)}
.prose ul,.prose ol{padding-left:1.2em}
.prose li{margin:5px 0}
.prose li::marker{color:var(--cobalt)}
.prose a{color:var(--cobalt-d);font-weight:600}
.aside{position:sticky;top:96px;border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:16px;background:var(--surface)}
.aside dt{color:var(--muted);margin-bottom:5px}
.aside dd{margin:0 0 6px;font-weight:600}
.aside dl{margin:0}
.callout{background:var(--violet-l);border-radius:16px;padding:14px 18px;color:#3A1F94;font-size:.96rem;margin:0 0 28px}
.related{margin-top:48px;border-top:1px solid var(--line);padding-top:24px}
.related ul{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:8px}
.related a{color:var(--cobalt-d);text-decoration:none;font-weight:700}

/* about */
.steps{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.steps li{border-radius:18px;padding:18px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.steps li::before{content:attr(data-n);font:800 2.2rem/1 var(--display);display:block;margin-bottom:12px;letter-spacing:-.03em}
.steps li:nth-child(1)::before{color:var(--cobalt)}.steps li:nth-child(2)::before{color:var(--violet)}.steps li:nth-child(3)::before{color:var(--rose)}.steps li:nth-child(4)::before{color:#E0A100}.steps li:nth-child(5)::before{color:var(--mint)}
.steps b{display:block;font:800 1.05rem/1.25 var(--display);margin-bottom:6px}
.steps span{color:var(--ink2);font-size:.93rem}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:44px}
.about-cta{background:var(--ink);color:#fff;border-radius:28px;padding:40px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.about-cta p{color:#C9CCEA;margin:0}
.about-cta .mono{color:var(--sun)}

/* search */
.search-box{display:flex;gap:10px;margin-bottom:28px}
.search-box input{flex:1;min-width:0;height:54px;border-radius:16px;border:1.5px solid var(--line2);background:var(--surface);color:var(--ink);font:500 1.02rem var(--body);padding:0 18px;transition:border-color .25s,box-shadow .25s}
.search-box input:focus{outline:none;border-color:var(--cobalt);box-shadow:0 0 0 4px var(--cobalt-l)}
.search-box input::placeholder{color:var(--muted)}

/* footer */
.site-footer{background:var(--ink);color:#C9CCEA;padding:44px 0 48px;margin-top:20px}
.site-footer .wrap{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:center}
.site-footer b{color:#fff;font:800 1.1rem/1.2 var(--display)}
.site-footer nav{display:flex;gap:20px;flex-wrap:wrap}
.site-footer a{text-decoration:none;font-weight:600}
.site-footer a:hover{color:var(--sun)}
.site-footer .mono{color:#8E92B8}

/* smooth page changes (same-document View Transitions, where supported) */
::view-transition-old(page){animation:vt-out .18s var(--ease) both}
::view-transition-new(page){animation:vt-in .34s var(--ease) both}
@keyframes vt-out{to{opacity:0;transform:translateY(-6px)}}
@keyframes vt-in{from{opacity:0;transform:translateY(10px)}}
img.fade{opacity:0}
img.fade.loaded{opacity:1}

/* responsive */
@media (max-width:980px){
  .hero .wrap,.detail,.two{grid-template-columns:minmax(0,1fr)}
  .card.big{grid-template-columns:minmax(0,1fr)}
  .card.big .shot{border-right:0;border-bottom:1px solid var(--line);padding:18px 18px 0}
  .card.big .body{padding:20px 22px 22px;gap:10px}
  .record{transform:none}
  .aside{position:static}
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}

    (showFilters?'<div class="filters" role="group" aria-label="Filter projects">'+['All'].concat(used).map(function(c){return '<button data-filter="'+esc(c)+'" aria-pressed="'+(c===projFilter)+'">'+esc(c)+'</button>';}).join('')+'</div>':'')+
    (list.length?'<div class="grid3">'+list.map(function(p){return projectCard(p);}).join('')+'</div>':empty('No projects in this category yet','Try another filter.'))+
    '<p class="mono" style="color:var(--muted);margin-top:28px">Status: Idea \u00b7 In progress \u00b7 Prototype (works, not hardened) \u00b7 Working (in real use) \u00b7 Archived</p></div>';
}
function project(slug){
  var p=PROJECTS.filter(function(x){return x.slug===slug;})[0];if(!p)return notFound();
  setTitle(p.title,p.summary);var s=p.sections||{};
  var sec=function(h,v){if(!v||(Array.isArray(v)&&!v.length))return '';return '<h2>'+h+'</h2>'+(Array.isArray(v)?'<ul>'+v.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>':'<p>'+esc(v)+'</p>');};
  var rel=FINDINGS.filter(function(f){return (p.relatedFindings||[]).indexOf(f.slug)>=0;});
  return '<div class="wrap page"><div class="crumbs mono"><a href="#/projects">Projects</a> / '+esc(p.title)+'</div>'+
  '<div class="detail"><div><div class="page-head" style="margin-bottom:14px"><h1>'+esc(p.title)+checkMark(p)+'</h1></div><p class="lead">'+esc(p.summary)+'</p>'+
    
    (p.cover?'<div class="hero-shot"><img src="'+esc(p.cover)+'" alt="'+esc(p.coverAlt||p.title)+'"></div>':'')+
    '<div class="prose">'+sec('The problem',s.problem)+sec('The idea',s.approach)+sec('What it does',s.features)+sec('How it works',s.howItWorks)+sec('AI\u2019s role',s.aiRole)+sec('Testing',s.testing)+sec('What worked',s.whatWorked)+sec('What didn\u2019t work',s.limitations)+sec('What I learned',s.lessonsLearned)+sec('Next steps',s.nextSteps)+'</div>'+
    (rel.length?'<div class="related"><span class="kind">Related</span><ul>'+rel.map(function(f){return '<li><a href="#/findings/'+f.slug+'">'+esc(f.title)+'</a></li>';}).join('')+'</ul></div>':'')+
  '</div><aside class="aside" aria-label="Project details"><dl>'+
    '<dt class="mono">Status</dt><dd>'+badge(p.status)+'</dd>'+
    '<dt class="mono">Type</dt><dd>'+esc(p.type)+'</dd>'+
    (p.updatedAt?'<dt class="mono">Updated</dt><dd>'+fmtDate(p.updatedAt)+'</dd>':'')+
    (p.tools&&p.tools.length?'<dt class="mono">Tools</dt><dd>'+p.tools.map(esc).join('<br>')+'</dd>':'')+
  '</dl>'+tags(p.tags)+'<div class="links" style="flex-direction:column;gap:8px">'+(p.liveUrl?ext(p.liveUrl,'Open live demo'):'')+(p.sourceUrl?ext(p.sourceUrl,'View source code'):'')+'</div></aside></div></div>';
}

function lab(){
  setTitle('AI Lab','Small, structured experiments into how AI systems behave.');
  return '<div class="wrap page"><div class="page-head"><span class="kind lab">AI Lab</span><h1>The AI Lab</h1><p>Small, structured experiments into how AI systems behave. I test specific questions, document the method, inspect failures, and share what the evidence supports\u2014including uncertainty and limitations.</p></div>'+
    '<div class="callout">Everything below is an <b>experiment idea</b>, not a finished experiment. Results appear here only after an experiment has been run and written up. Related small findings are linked where they exist.</div>'+
    '<div class="rows">'+EXPERIMENTS.map(function(e){return '<a class="row-item" href="#/lab/'+e.slug+'"><div><span class="kind lab">'+esc(e.category)+'</span><h3 style="margin-top:8px">'+esc(e.title)+'</h3><p>'+esc(e.summary)+'</p></div><div class="side">'+badge(e.status)+'</div></a>';}).join('')+'</div></div>';
}
function experiment(slug){
  var e=EXPERIMENTS.filter(function(x){return x.slug===slug;})[0];if(!e)return notFound();
  setTitle(e.title,e.summary);
  var rel=FINDINGS.filter(function(f){return (e.relatedFindings||[]).indexOf(f.slug)>=0;});
  return '<div class="wrap page"><div class="crumbs mono"><a href="#/lab">AI Lab</a> / '+esc(e.title)+'</div>'+
  '<div class="detail"><div><div class="page-head" style="margin-bottom:14px"><h1>'+esc(e.title)+'</h1></div><p class="lead">'+esc(e.summary)+'</p>'+
    '<div class="callout">Status: <b>Idea</b>. This experiment has not been run. There are no results yet, so none are shown.</div>'+
    '<div class="prose"><h2>Question</h2><p>'+esc(e.summary)+'</p><h2>Planned method</h2><ol>'+e.method.map(function(m){return '<li>'+esc(m)+'</li>';}).join('')+'</ol>'+
    '<h2>What it would measure</h2><ul>'+e.measures.map(function(m){return '<li>'+esc(m)+'</li>';}).join('')+'</ul>'+
    '<h2>Results</h2><p>Not run yet.</p></div>'+
    (rel.length?'<div class="related"><span class="kind">Related finding</span><ul>'+rel.map(function(f){return '<li><a href="#/findings/'+f.slug+'">'+esc(f.title)+'</a></li>';}).join('')+'</ul></div>':'')+
  '</div><aside class="aside" aria-label="Experiment details"><dl><dt class="mono">Status</dt><dd>'+badge(e.status)+'</dd><dt class="mono">Topic</dt><dd>'+esc(e.category)+'</dd></dl></aside></div></div>';
}

function findings(){
  setTitle('Findings','Notes from testing, comparing, and investigating.');
  return '<div class="wrap page"><div class="page-head"><span class="kind find">Findings</span><h1>Findings</h1><p>Notes from testing, comparing, and investigating. Some are small discoveries; others become full experiments or projects.</p></div>'+
    (FINDINGS.length?'<div class="rows">'+FINDINGS.map(function(f){return '<a class="row-item finding-row" href="#/findings/'+f.slug+'"><div class="figure-num">'+esc(f.figure)+'</div><div><span class="kind find">'+esc(f.category)+'</span><h3 style="margin-top:8px">'+esc(f.title)+'</h3><p>'+esc(f.summary)+'</p></div><div class="side"></div></a>';}).join('')+'</div>'
     :'<div class="empty find"><div class="glyph" aria-hidden="true">F</div><b>Coming soon...</b></div>')+'</div>';
}
function finding(slug){
  var f=FINDINGS.filter(function(x){return x.slug===slug;})[0];if(!f)return notFound();
  setTitle(f.title,f.summary);
  var rel=EXPERIMENTS.filter(function(e){return (f.relatedExperiments||[]).indexOf(e.slug)>=0;});
  return '<div class="wrap page"><div class="crumbs mono"><a href="#/findings">Findings</a> / '+esc(f.title)+'</div>'+
  '<div class="detail"><div><div class="figure-num" style="font-size:3rem;margin-bottom:10px">'+esc(f.figure)+'</div><div class="page-head" style="margin-bottom:14px"><h1>'+esc(f.title)+checkMark(f)+'</h1></div>'+
    '<div class="prose"><h2>What I noticed</h2><p>'+esc(f.summary)+'</p><h2>Context and method</h2><p>A small experiment with made-up data on a model I ran myself. The full method, prompts and numbers are in the write-up.</p>'+
    '<h2>Read the write-up</h2><p>'+ext(f.source,'ai-ops-portfolio on GitHub')+'</p></div>'+
    (rel.length?'<div class="related"><span class="kind">Possible next experiment</span><ul>'+rel.map(function(e){return '<li><a href="#/lab/'+e.slug+'">'+esc(e.title)+'</a></li>';}).join('')+'</ul></div>':'')+
  '</div><aside class="aside"><dl><dt class="mono">Category</dt><dd>'+esc(f.category)+'</dd><dt class="mono">Data</dt><dd>Made up for the test</dd></dl></aside></div></div>';
}

function notes(){
  setTitle('Notes','An evolving collection of concepts, ideas and references.');
  return '<div class="wrap page"><div class="page-head"><span class="kind note">Notes</span><h1>Notes &amp; Digital Garden</h1><p>An evolving collection of concepts I\u2019m learning, ideas I\u2019m exploring, useful references, and lessons from things that did not work the first time.</p></div>'+
    (NOTES.length?'':'<div class="empty note"><div class="glyph" aria-hidden="true">N</div><b>Coming soon...</b></div>')+'</div>';
}

function about(sub){
  setTitle('About','About Mridul Saravanan - coming soon.');
  var html='<div class="wrap page"><div class="page-head"><h1>About</h1></div>'+
    '<div class="empty about"><div class="glyph" aria-hidden="true">A</div><b>Coming soon...</b></div>'+
    '<section id="contact"><div class="sec-head"><h2 class="sec">Let\u2019s connect</h2></div><div class="about-cta"><div><p>Interested in a project, an experiment, or a practical problem worth exploring? Feel free to reach out.</p><p class="mono" style="margin-top:10px">'+esc(SITE.email)+'</p></div>'+
      '<div class="row" style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn sun" href="mailto:'+SITE.email+'">Email me</a><a class="btn ghost-light" href="'+SITE.linkedin+'" target="_blank" rel="noopener">LinkedIn</a><a class="btn ghost-light" href="'+SITE.github+'" target="_blank" rel="noopener">GitHub</a></div></div></section></div>';
  if(sub==='contact')setTimeout(function(){var c=document.getElementById('contact');if(c)c.scrollIntoView();},0);
  return html;
}

function now(){
  setTitle('Now','What Mridul is working on now.');
  return '<div class="wrap page"><div class="page-head"><h1>Now</h1><p class="mono">Last updated '+fmtDate(SITE.nowUpdated)+'</p></div>'+
    '<div class="two"><div class="prose"><h2 style="margin-top:0">Currently exploring</h2><ul><li>AI Operations and output quality</li><li>Evaluation test sets and scoring rubrics</li><li>Human-in-the-loop workflows</li><li>AI-assisted applications and practical tools</li></ul></div>'+
    '<div class="prose"><h2 style="margin-top:0">Currently working on</h2><ul><li><a href="#/projects/mayhemnull">MayhemNull</a>: finishing sign-in and YouTube search</li></ul><h2>Next up</h2><ul><li>Run the first full experiment from the <a href="#/lab">AI Lab</a></li></ul></div></div></div>';
}

function search(q){
  setTitle('Search');
  q=(q||'').trim();var ql=q.toLowerCase();
  var items=[].concat(
    PROJECTS.map(function(p){return {k:'Project',t:p.title,s:p.summary,h:'#/projects/'+p.slug,x:(p.title+' '+p.summary+' '+(p.tags||[]).join(' ')).toLowerCase()};}),
    EXPERIMENTS.map(function(e){return {k:'Experiment idea',t:e.title,s:e.summary,h:'#/lab/'+e.slug,x:(e.title+' '+e.summary+' '+e.category).toLowerCase()};}),
    FINDINGS.map(function(f){return {k:'Finding',t:f.title,s:f.summary,h:'#/findings/'+f.slug,x:(f.title+' '+f.summary+' '+f.category).toLowerCase()};}),
    NOTES.map(function(n){return {k:'Note',t:n.title,s:n.summary,h:'#/notes/'+n.slug,x:(n.title+' '+n.summary).toLowerCase()};})
  );
  var hits=ql?items.filter(function(i){return ql.split(/\s+/).every(function(w){return i.x.indexOf(w)>=0;});}):[];
  return '<div class="wrap page"><div class="page-head"><h1>Search</h1><p>Projects, experiment ideas, findings and notes.</p></div>'+
    '<form class="search-box" id="searchForm" role="search"><label for="q" class="skip" style="position:absolute;left:-999px">Search</label><input id="q" name="q" type="search" placeholder="Try \u201crepeatability\u201d or \u201cgame\u201d" value="'+esc(q)+'" autocomplete="off"><button class="btn primary" type="submit">Search</button></form>'+
    (ql?(hits.length?'<div class="rows">'+hits.map(function(h){return '<a class="row-item" href="'+h.h+'"><div><span class="kind">'+esc(h.k)+'</span><h3 style="margin-top:8px">'+esc(h.t)+'</h3><p>'+esc(h.s)+'</p></div></a>';}).join('')+'</div>':empty('Nothing found for \u201c'+q+'\u201d','Try a shorter word, or browse the sections from the menu.')):'')+'</div>';
}

function notFound(){setTitle('Not found');return '<div class="wrap page">'+empty('That page does not exist','It may have moved.','<a class="btn" href="#/">Go home</a>')+'</div>';}

/* ================= router ================= */
var ROUTES={'':home,'projects':projects,'lab':lab,'findings':findings,'notes':notes,'about':about,'now':now,'search':search};
function render(){
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(document.startViewTransition&&!reduce&&render.ready){document.startViewTransition(paint);}else paint();
  render.ready=true;
}
function paint(){
  var h=(location.hash||'#/').replace(/^#\/?/,''),parts=h.split('?'),path=parts[0].split('/'),qs=new URLSearchParams(parts[1]||'');
  var top=path[0]||'',sub=path[1];
  var html;
  if(top==='projects'&&sub)html=project(sub);
  else if(top==='lab'&&sub)html=experiment(sub);
  else if(top==='findings'&&sub)html=finding(sub);
  else if(top==='search')html=search(qs.get('q'));
  else if(top==='about')html=about(sub);
  else if(ROUTES.hasOwnProperty(top))html=ROUTES[top]();
  else html=notFound();
  var main=$('#main');main.innerHTML=html;
  document.querySelectorAll('#nav a').forEach(function(a){var t=a.getAttribute('href').replace(/^#\/?/,'');a.toggleAttribute('aria-current',t===top);if(t===top)a.setAttribute('aria-current','page');});
  $('#nav').classList.remove('open');$('#menuBtn').setAttribute('aria-expanded','false');
  if(sub!=='contact')window.scrollTo(0,0);
  bind();
  main.querySelectorAll('img').forEach(function(im){if(im.complete)return;im.classList.add('fade');im.addEventListener('load',function(){im.classList.add('loaded');},{once:true});});
}
function bind(){
  document.querySelectorAll('[data-filter]').forEach(function(b){b.onclick=function(){projFilter=b.getAttribute('data-filter');render();};});
  var f=$('#searchForm');if(f){f.onsubmit=function(e){e.preventDefault();location.hash='#/search?q='+encodeURIComponent($('#q').value);};var q=$('#q');if(q&&!q.value)q.focus();}
}
$('#menuBtn').onclick=function(){var n=$('#nav'),o=n.classList.toggle('open');this.setAttribute('aria-expanded',o?'true':'false');};
$('#copy').textContent='\u00a9 '+new Date().getFullYear()+' Mridul Saravanan';
if(location.hash==='#play')location.replace('play/');
window.addEventListener('hashchange',render);
render();
})();
</script>
</body>
